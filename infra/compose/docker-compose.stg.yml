x-backend-environment: &backend-environment
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:?Set DJANGO_SETTINGS_MODULE in env/.env.stg}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in env/.env.stg}
  SITE_URL: ${SITE_URL:?Set SITE_URL in env/.env.stg}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in env/.env.stg}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in env/.env.stg}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Set DEFAULT_FROM_EMAIL in env/.env.stg}
  SERVER_EMAIL: ${SERVER_EMAIL:?Set SERVER_EMAIL in env/.env.stg}
  EMAIL_HOST: ${EMAIL_HOST:?Set EMAIL_HOST in env/.env.stg}
  EMAIL_PORT: ${EMAIL_PORT:?Set EMAIL_PORT in env/.env.stg}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:?Set EMAIL_HOST_USER in env/.env.stg}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?Set EMAIL_HOST_PASSWORD in env/.env.stg}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:?Set EMAIL_USE_TLS in env/.env.stg}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:?Set EMAIL_USE_SSL in env/.env.stg}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in env/.env.stg}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in env/.env.stg}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in env/.env.stg}
  POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in env/.env.stg}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in env/.env.stg}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:?Set REDIS_KEY_PREFIX in env/.env.stg}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:?Set AWS_STORAGE_BUCKET_NAME in env/.env.stg}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:?Set AWS_S3_REGION_NAME in env/.env.stg}
  AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:?Set AWS_S3_CUSTOM_DOMAIN in env/.env.stg}

name: aliencommons-stg

services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in env/.env.stg}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in env/.env.stg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in env/.env.stg}
    volumes:
      - postgres_data_stg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in env/.env.stg}
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend-init:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in env/.env.stg}
    environment: *backend-environment
    working_dir: /code/apps/backend
    command: >
      sh -c "python manage.py migrate && python manage.py init_tasks && python manage.py collectstatic --noinput"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /srv/aliencommons/stg/static:/code/apps/backend/staticfiles

  backend-api:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in env/.env.stg}
    working_dir: /code/apps/backend
    restart: unless-stopped
    environment:
      <<: *backend-environment
      INTERNAL_ALLOWED_HOSTS: backend-api
    command: >
      sh -c "daphne -b 0.0.0.0 -p 8000 backend.asgi:application"
    depends_on:
      alienmark:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://backend-api:8000/v1/sessions/csrf/', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-api-stg.rule=Host(`api.stg.aliencommons.com`)"
      - "traefik.http.routers.backend-api-stg.entrypoints=websecure"
      - "traefik.http.routers.backend-api-stg.middlewares=web-secure@file"
      - "traefik.http.routers.backend-api-stg.service=backend-api-stg"
      - "traefik.http.routers.backend-api-same-origin-stg.rule=Host(`stg.aliencommons.com`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.backend-api-same-origin-stg.entrypoints=websecure"
      - "traefik.http.routers.backend-api-same-origin-stg.middlewares=backend-api-strip-prefix-stg,web-secure@file"
      - "traefik.http.routers.backend-api-same-origin-stg.priority=100"
      - "traefik.http.routers.backend-api-same-origin-stg.service=backend-api-stg"
      - "traefik.http.middlewares.backend-api-strip-prefix-stg.stripprefix.prefixes=/api"
      - "traefik.http.services.backend-api-stg.loadbalancer.server.port=8000"
    networks:
      - default
      - proxy
    volumes:
      - /srv/aliencommons/stg/static:/code/apps/backend/staticfiles

  backend-task-scheduler:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in env/.env.stg}
    environment: *backend-environment
    working_dir: /code/apps/backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py runscheduler"

  backend-task-worker:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in env/.env.stg}
    environment: *backend-environment
    working_dir: /code/apps/backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py rqworker --job-class django_tasks_rq.Job default email maintenance"

  alloy:
    image: grafana/alloy:v1.17.0
    restart: unless-stopped
    command:
      - run
      - --disable-reporting
      - --server.http.listen-addr=0.0.0.0:12345
      - --server.http.enable-pprof=false
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      ALLOY_COMPOSE_PROJECT: aliencommons-stg
      ALLOY_ENVIRONMENT: stg
    volumes:
      - ../../o11y/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data_stg:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
        restart: true

  loki:
    image: grafana/loki:3.7.2
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION_PERIOD: 336h
    volumes:
      - ../../o11y/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data_stg:/loki
    # The official Loki image is distroless, so health checks cannot use a shell.
    healthcheck:
      test:
        [
          "CMD",
          "/usr/bin/loki",
          "-config.file=/etc/loki/loki.yml",
          "-config.expand-env=true",
          "-verify-config=true",
        ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 1m

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in env/.env.stg}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana-stg.rule=Host(`grafana.stg.aliencommons.com`)"
      - "traefik.http.routers.grafana-stg.entrypoints=websecure"
      - "traefik.http.routers.grafana-stg.middlewares=web-secure@file"
      - "traefik.http.services.grafana-stg.loadbalancer.server.port=3000"
    networks:
      - default
      - proxy
    volumes:
      - ../../o11y/grafana/provisioning/datasources/loki.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - grafana_data_stg:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
        restart: true

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in env/.env.stg}
    restart: unless-stopped
    environment:
      NUXT_API_INTERNAL_BASE: http://backend-api:8000
      NUXT_PUBLIC_API_BASE: /api
      NUXT_PUBLIC_I18N_BASE_URL: https://stg.aliencommons.com
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-stg.rule=Host(`stg.aliencommons.com`)"
      - "traefik.http.routers.frontend-stg.entrypoints=websecure"
      - "traefik.http.routers.frontend-stg.middlewares=web-secure@file"
      - "traefik.http.services.frontend-stg.loadbalancer.server.port=3000"
    networks:
      - default
      - proxy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  alienmark:
    image: ${ALIENMARK_IMAGE:?Set ALIENMARK_IMAGE in env/.env.stg}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  static:
    image: nginx:alpine
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.static-stg.rule=Host(`api.stg.aliencommons.com`) && PathPrefix(`/static`)"
      - "traefik.http.routers.static-stg.entrypoints=websecure"
      - "traefik.http.routers.static-stg.middlewares=web-secure@file"
      - "traefik.http.services.static-stg.loadbalancer.server.port=80"
    networks:
      - proxy
    restart: unless-stopped
    volumes:
      - /srv/aliencommons/stg/static:/usr/share/nginx/html/static:ro

volumes:
  postgres_data_stg:
  alloy_data_stg:
  grafana_data_stg:
  loki_data_stg:

networks:
  proxy:
    external: true
    name: aliencommons-proxy
