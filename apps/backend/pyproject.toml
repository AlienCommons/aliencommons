[project]
name = "aliencommons-backend"
version = "0.2.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
  "channels[daphne]==4.3.2",
  "django==6.1",
  "django-cors-headers==4.9.0",
  "django-filter==26.1",
  "django-redis==7.0.0",
  "django-storages[s3]==1.14.6",
  "django-tasks-rq==0.12.0",
  "djangorestframework==3.18.0",
  "drf-spectacular==0.30.0",
  "drf-std-response==0.1.0",
  "environs==15.1.0",
  "nh3==0.3.7",
  "pillow==12.3.0",
  "psycopg[binary]==3.3.4",
  "requests==2.34.2",
  "user-agents==2.2.0",
]

[dependency-groups]
dev = ["ruff==0.16.4"]

[tool.uv]
add-bounds = "exact"
