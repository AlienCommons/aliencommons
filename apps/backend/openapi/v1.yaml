          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
      required:
      - request_id
      - timestamp
    ArticleActionResponse:
      type: object
      properties:
        event_type:
          type: integer
        actor_id:
          type: string
          format: uuid
        article_id:
          type: string
          format: uuid
        article_snapshot_id:
          type: string
          format: uuid
          nullable: true
        event_id:
          type: string
          format: uuid
        event_type_display:
          type: string
          readOnly: true
      required:
      - actor_id
      - article_id
      - article_snapshot_id
      - event_id
      - event_type
      - event_type_display
    ArticleEvent:
      type: object
      description: |-
        Serializer for article moderation events.
        All fields are read-only.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The UUID of the object
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The created DateTime of the object
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          readOnly: true
          description: |-
            The event type of the article event

            * `0` - Create
            * `1` - Submit
            * `2` - Withdraw
            * `3` - Approve
            * `4` - Reject
            * `5` - Unpublish
            * `6` - Delete
        article:
          type: string
          format: uuid
          description: The article of the article event
          readOnly: true
        article_snapshot:
          type: string
          format: uuid
          description: The article snapshot of the article event
          readOnly: true
          nullable: true
          title: Snapshot
        actor:
          type: string
          format: uuid
          description: The actor of the article event
          readOnly: true
          nullable: true
      required:
      - actor
      - article
      - article_snapshot
      - created_at
      - event_type
      - id
    ArticlePublication:
      type: object
      description: Serializer for article publications. All fields are ready-only.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The UUID of the object
        article:
          type: string
          format: uuid
          description: The article of the publication
          readOnly: true
        latest_version:
          allOf:
          - $ref: '#/components/schemas/ArticlePublicationVersion'
          nullable: true
          readOnly: true
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ArticlePublicationVersion'
          readOnly: true
        title:
          type: string
          nullable: true
          readOnly: true
        html:
          type: string
          nullable: true
          readOnly: true
        publication_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          title: First published at
          description: The DateTime when this article publication was first created
        like_count:
          type: integer
          minimum: 0
          readOnly: true
        dislike_count:
          type: integer
          minimum: 0
          readOnly: true
        my_reaction:
          type: integer
          nullable: true
          readOnly: true
        comment_count:
          type: integer
          minimum: 0
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The created DateTime of the object
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The updated DateTime of the object
      required:
      - article
      - comment_count
      - created_at
      - dislike_count
      - html
      - id
      - latest_version
      - like_count
      - my_reaction
      - publication_at
      - published_at
      - title
      - updated_at
      - versions
    ArticlePublicationVersion:
      type: object
      description: Serializer for immutable article publication versions.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The UUID of the object
        approved_snapshot:
          type: string
          format: uuid
          description: The approved snapshot used to render this publication version
          readOnly: true
        version:
          type: integer
          readOnly: true
          description: The publication version number, starting from 1
        title:
          type: string
          readOnly: true
          description: The title of the article publication version
        html:
          type: string
          readOnly: true
        publication_at:
          type: string
          format: date-time
          readOnly: true
          title: Published at
          description: The DateTime this publication version was created
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The created DateTime of the object
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The updated DateTime of the object
      required:
      - approved_snapshot
      - created_at
      - html
      - id
      - publication_at
      - title
      - updated_at
      - version
