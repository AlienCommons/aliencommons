      - title
      - updated_at
      - version
    ArticleSnapshot:
      type: object
      description: Serializer for article snapshots. All fields are ready-only.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The UUID of the object
        moderation_status_display:
          type: string
          readOnly: true
        article_id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The created DateTime of the object
        title:
          type: string
          readOnly: true
          description: The title of the article snapshot
        markdown:
          type: string
          readOnly: true
          title: Article in markdown
          description: The article in Markdown format
        hash:
          type: string
          readOnly: true
          description: The hash value of the article snapshot
        source_version:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: The source version of the article snapshot
        moderation_status:
          allOf:
          - $ref: '#/components/schemas/ModerationStatusEnum'
          readOnly: true
          description: |-
            The moderation status of the article snapshot

            * `1` - Pending
            * `2` - Withdrawn
            * `3` - Approved
            * `4` - Rejected
        article:
          type: string
          format: uuid
          description: The article of the article snapshot
          readOnly: true
      required:
      - article
      - article_id
      - created_at
      - hash
      - id
      - markdown
      - moderation_status
      - moderation_status_display
      - source_version
      - title
    ArticleStatusEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
