name: "Stg Infrastructure"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Plan or apply the reviewed staging infrastructure"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan
      confirmation:
        description: "Enter apply-stg when action is apply"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: stg-infrastructure
  cancel-in-progress: false

jobs:
  infrastructure:
    environment: stg
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: infra/opentofu/environments/stg

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_account_id: ${{ vars.AWS_STG_ACCOUNT_ID }}
      TF_VAR_aws_region: ${{ vars.AWS_STG_REGION }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_state_bucket_name: ${{ vars.AWS_STG_OPENTOFU_STATE_BUCKET }}

    steps:
      - name: Validate apply confirmation
        if: inputs.action == 'apply' && inputs.confirmation != 'apply-stg'
        run: |
          echo "Refusing to apply without the exact apply-stg confirmation." >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - name: Configure staging AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_STG_REGION }}
          role-to-assume: ${{ vars.AWS_STG_TOFU_ROLE_TO_ASSUME }}
          allowed-account-ids: ${{ vars.AWS_STG_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Check formatting
        run: tofu fmt -check -recursive ../..

      - name: Initialize staging backend
        run: tofu init -backend-config="bucket=${AWS_STG_OPENTOFU_STATE_BUCKET}"
        env:
          AWS_STG_OPENTOFU_STATE_BUCKET: ${{ vars.AWS_STG_OPENTOFU_STATE_BUCKET }}

      - name: Validate configuration
        run: tofu validate -no-color

      - name: Create plan
        run: tofu plan -no-color -out=stg.tfplan

      - name: Apply reviewed plan
        if: inputs.action == 'apply'
        run: tofu apply -no-color -auto-approve stg.tfplan
