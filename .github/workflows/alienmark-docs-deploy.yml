name: "AlienMark Docs: Deploy"

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "docs/alienmark/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/alienmark-docs-deploy.yml"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: vars.AWS_DOCS_DEPLOY_ENABLED == 'true'
    environment: stg
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs/alienmark

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.23"
          enable-cache: true
          working-directory: .
          cache-suffix: alienmark-docs-deploy

      - name: Install docs dependencies
        run: uv sync --project ../.. --locked --package alienmark-docs

      - name: Build English Zensical site
        run: uv run --project ../.. --package alienmark-docs zensical build --strict

      - name: Build Chinese Zensical site
        run: uv run --project ../.. --package alienmark-docs zensical build --strict --config-file zensical.zh.toml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_STG_REGION }}
          role-to-assume: ${{ vars.AWS_STG_ROLE_TO_ASSUME }}
          allowed-account-ids: ${{ vars.AWS_STG_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Deploy site to S3
        run: aws s3 sync site/ s3://${{ vars.AWS_STG_S3_BUCKET }}/ --delete
